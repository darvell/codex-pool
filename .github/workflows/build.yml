name: Build and publish image

# Push-only on purpose. This repository is public and the job runs on a
# self-hosted runner with a privileged in-pod Docker daemon, so a
# `pull_request` (or `pull_request_target`, `workflow_run`, `issue_comment`)
# trigger would let an unreviewed fork execute code on that machine.
# Only pushes to branches and tags — which require write access — build here.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Documentation and chart-only changes do not affect the image.
    paths-ignore:
      - '**/*.md'
      - 'charts/**'
  workflow_dispatch:

# The built-in GITHUB_TOKEN is the only credential this workflow needs:
# `packages: write` lets it push to ghcr.io under this repository's owner.
# No repository secret has to be configured by hand.
permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish container image
    # Self-hosted Actions Runner Controller scale set. Only one runner pod is
    # active at a time, so a build queues behind other repositories on the node.
    # Anyone running this workflow elsewhere should change this to the label of
    # their own runner, or to `ubuntu-latest` for GitHub-hosted runners.
    runs-on: pure-vps-linux-x64-codex-pool
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        run: |
          set -euo pipefail
          # GHCR rejects uppercase; GITHUB_REPOSITORY may contain it.
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=codex-pool
            org.opencontainers.image.description=Reverse proxy that spreads coding-agent sessions across pooled provider accounts
            org.opencontainers.image.licenses=MIT
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # linux/amd64 only, for two independent reasons: the Dockerfile pins
          # `ENV CGO_ENABLED=1 GOOS=linux GOARCH=amd64`, so any other platform
          # would produce an amd64 binary in a foreign-arch image; and the
          # self-hosted runner is amd64 with no CPU budget for QEMU emulation.
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summarise
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### Container image"
            echo
            echo "Digest: \`${IMAGE_DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            printf '%s\n' "${IMAGE_TAGS}"
            echo '```'
            echo
            echo "Pin it in the Helm chart with:"
            echo '```yaml'
            echo "image:"
            echo "  digest: ${IMAGE_DIGEST}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
