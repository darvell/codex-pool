{{- include "codex-pool.guard" . -}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "codex-pool.pvcName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codex-pool.labels" . | nindent 4 }}
  {{- if or .Values.persistence.keepOnDelete .Values.persistence.annotations }}
  annotations:
    {{- if .Values.persistence.keepOnDelete }}
    # Pooled credentials and OAuth refresh tokens outlive the release.
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  # Fixed: the workload is single-writer by construction. See templates/_guard.tpl.
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
